name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Quality Gate 1: Static Analysis ──────────────────────────────
  static_analysis:
    name: "QG1 · Static Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Ty type check
        run: uv run ty check

      - name: Import boundary contracts
        run: uv run lint-imports

      - name: Marker hygiene
        run: uv run pytest --collect-only -q

  # ── Quality Gate 2: Foundation Packages (shared, config) ─────────
  # Not folded into _test-layer.yml: no Mongo service, no integration
  # tier today — a genuinely different shape, not just fewer lines.
  foundation:
    name: "QG2 · Shared & Config Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static_analysis
    env:
      TRUTINA_TEST_MONGO__URI: mongodb://localhost:27017
      TRUTINA_TEST_MONGO__DB: trutina_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen

      - run: chmod +x tools/ci/pytest-optional.sh

      - run: >
          tools/ci/pytest-optional.sh "unit and shared"
          --cov=trutina --cov-report=term-missing

  # ── Quality Gates 3–5: Storage-backed layers ─────────────────────
  # Each of these calls the shared _test-layer.yml reusable workflow
  # rather than repeating checkout/setup/sync/service/test steps per
  # job. `needs:` still enforces ordering — reusable workflows don't
  # change dependency semantics. `storage_mongo` is the current sole
  # backend for the `infra` layer; a `storage_postgres` job joins it
  # here, not inside it, once trutina-storage-postgres exists
  # (MongoDB to PSQL Plan.md, Phase 6).
  core:
    name: "QG3 · Core"
    needs: foundation
    uses: ./.github/workflows/_test-layer.yml
    with:
      marker: core

  storage_mongo:
    name: "QG4 · Storage · Mongo"
    needs: core
    uses: ./.github/workflows/_test-layer.yml
    with:
      marker: infra
      backend: mongo

  cli:
    name: "QG5 · CLI App"
    needs: storage_mongo
    uses: ./.github/workflows/_test-layer.yml
    with:
      marker: cli

  api:
    name: "QG5 · API App"
    needs: storage_mongo
    uses: ./.github/workflows/_test-layer.yml
    with:
      marker: api

  # ── Quality Gate 6: Build ─────────────────────────────────────────
  build:
    name: "QG6 · Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [cli, api]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen

      # Builds every workspace member, trutina-cli and trutina-api
      # included. Scoped `uv build --package ...` steps were removed —
      # they were fully redundant with --all-packages. Re-add one only
      # if a later step needs to consume that specific package's wheel
      # (e.g. an upload-artifact step for a release job).
      - name: Build all packages
        run: uv build --all-packages

  # ── Quality Gate 7: Docker Smoke Test ─────────────────────────────────────────
  smoke:
    name: "QG7 · Docker Smoke Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test API image
        run: |
          chmod +x tools/docker-build.sh tools/docker-smoke.sh
          tools/docker-smoke.sh