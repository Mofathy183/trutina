name: Test Layer (Postgres-backed)

# Reusable workflow for the app-facing layers in ci.yml: core, cli,
# api. All three now depend on PostgreSQL for their integration tests
# (tests/fixtures/services.py wires AccountService/JournalService/
# PostingService against Postgres*Repo — see the storage-postgres
# migration). This file has no `backend` input: unlike the infra layer,
# these three only ever mean Postgres today, so there's nothing to
# select between.
#
# trutina-storage-mongo's own adapter tests run through
# _test-layer-mongo.yml instead — that package is retained but no
# longer load-bearing for any app-facing layer, so it gets its own
# dedicated file rather than sharing this one.

on:
  workflow_call:
    inputs:
      marker:
        description: >-
          The layer marker to filter tests by ("core", "cli", "api").
          Combined with "unit"/"integration" as "<speed> and <marker>".
        required: true
        type: string

env:
  TRUTINA_TEST_POSTGRES__URI: postgresql+asyncpg://postgres:postgres@localhost:5432/trutina_test

jobs:
  test:
    name: "${{ inputs.marker }} (unit + integration)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trutina_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen

      - run: chmod +x tools/ci/pytest-optional.sh

      - name: Alembic upgrade head
        working-directory: packages/storage-postgres
        run: uv run alembic -x db=test upgrade head

      - name: Unit tests
        run: >
          tools/ci/pytest-optional.sh "unit and ${{ inputs.marker }}"
          --cov=trutina --cov-report=term-missing

      - name: Integration tests
        run: tools/ci/pytest-optional.sh "integration and ${{ inputs.marker }}"