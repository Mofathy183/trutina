name: Test Layer (Mongo-backed)

# Reusable workflow for Mongo-backed layers in ci.yml (core, infra/mongo,
# cli, api). Previously each of those jobs was a 15-line copy-paste of
# checkout/setup-uv/setup-python/uv sync/mongo-service/pytest-optional
# steps, differing only by marker. This file keeps that shape in one
# place; ci.yml calls it once per layer.
#
# Backend axis: conftest.py's pytest_collection_modifyitems() derives a
# "mongo"/"postgres" backend marker for any test under a storage-backend
# directory (_BACKEND_DIRS), and REQUIRES it for every infra-layer test.
# Non-infra tests must carry none. `backend` here mirrors that: required
# when marker == "infra", must stay empty otherwise.
#
# NOT used by `foundation` (no Mongo service, no integration tests) or
# `static_analysis`/`build` (no tests at all).
#
# Postgres note: once trutina-storage-postgres exists, its integration
# tests need a postgres:16 service container, not mongo:8. GitHub
# Actions `services:` blocks don't support `if:`, so that backend gets
# its own reusable workflow (_test-layer-postgres.yml), called with
# marker: infra, backend: postgres — mirroring this file's shape, not
# branching inside it. Don't add postgres here.

on:
  workflow_call:
    inputs:
      marker:
        description: >-
          The layer marker to filter tests by ("core", "infra", "cli",
          "api"). Combined with "unit"/"integration" and, for "infra",
          the required `backend` input, as
          "<speed> and <marker>[ and <backend>]".
        required: true
        type: string
      backend:
        description: >-
          Storage-backend marker for infra-layer runs ("mongo" today;
          "postgres" once trutina-storage-postgres exists). Required
          when marker == "infra". Must stay empty for every other layer
          — conftest.py rejects a backend marker on a non-infra test, so
          setting this here for e.g. "cli" would just silently match
          zero tests instead of failing loudly.
        required: false
        type: string
        default: ""

env:
  TRUTINA_TEST_MONGO__URI: mongodb://localhost:27017
  TRUTINA_TEST_MONGO__DB: trutina_test

jobs:
  test:
    name: "${{ inputs.marker }}${{ inputs.backend != '' && format('/{0}', inputs.backend) || '' }} (unit + integration)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen

      - run: chmod +x tools/ci/pytest-optional.sh

      - name: Compute pytest marker expression
        id: markers
        run: |
          expr="${{ inputs.marker }}"
          if [ -n "${{ inputs.backend }}" ]; then
            expr="$expr and ${{ inputs.backend }}"
          fi
          echo "expr=$expr" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: >
          tools/ci/pytest-optional.sh "unit and ${{ steps.markers.outputs.expr }}"
          --cov=trutina --cov-report=term-missing

      - name: Integration tests
        run: tools/ci/pytest-optional.sh "integration and ${{ steps.markers.outputs.expr }}"