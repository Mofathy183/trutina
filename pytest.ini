[pytest]
pythonpath =
    .

testpaths =
    tests
    apps
    packages

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

consider_namespace_packages = true

addopts =
    -ra
    --strict-markers
    --import-mode=importlib

markers =
    unit: Fast unit tests, no I/O
    integration: Integration tests requiring external services
    core: packages/core — domain logic and services
    infra: packages/storage-* — adapters implementing a storage-agnostic repo contract (any backend)
    cli: apps/cli — Typer commands and CLI composition root
    api: apps/api — FastAPI routes and API composition root
    shared: packages/shared — cross-cutting validation rules and the error model
    config: packages/config — typed environment-driven settings
    observability: packages/observability — logging configuration and correlation
    authentication: packages/authentication — identity contracts, hashing and token modules (no I/O)
    mongo: infra-layer tests backed by MongoDB
    postgres: infra-layer tests backed by PostgreSQL