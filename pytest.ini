[pytest]
pythonpath =
    .

testpaths =
    tests
    apps
    packages

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

addopts =
    -ra
    --strict-markers
    --import-mode=importlib

markers =
    unit: Fast unit tests, no I/O
    integration: Integration tests requiring external services
    core: core/ — domain logic and services
    infra: adapters implementing a storage-agnostic repo contract (any backend)
    cli: cli/ — Typer commands and CLI composition root
    api: api/ — FastAPI routes and API composition root
    shared: shared/ and config/ — cross-cutting helpers
    mongo: infra-layer tests backed by MongoDB