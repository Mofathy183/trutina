[project]
name = "trutina-infrastructure"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beanie>=2.1.0",
    "pymongo>=4.17.0",
    "trutina-shared",
    "trutina-core",
    "trutina-config",
]

[tool.uv.sources]
trutina-shared = { workspace = true }
trutina-core = { workspace = true }
trutina-config = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true