[project]
name = "trutina-cli"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.25.1",
    "rich>=15.0.0",
    "anyio>=4.14.1",
    "prompt-toolkit>=3.0.53",
    "trutina-core",
    "trutina-storage-postgres",
    "trutina-config",
]

[tool.uv.sources]
trutina-core = { workspace = true }
trutina-storage-postgres = { workspace = true }
trutina-config = { workspace = true }

[project.scripts]
trutina-cli = "trutina.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
