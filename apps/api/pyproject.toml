[project]
name = "trutina-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "trutina-core",
    "trutina-storage-mongo",
    "trutina-config",
]

[tool.uv.sources]
trutina-core = { workspace = true }
trutina-storage-mongo = { workspace = true }
trutina-config = { workspace = true }

[project.scripts]
trutina-api = "trutina.api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
