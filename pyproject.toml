[project]
name = "trutina-workspace"
version = "0.1.0"
description = "A simple command-line bookkeeping system built in Python that simulates how a real accounting system works."
readme = "README.md"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "httpx>=0.28.1",
    "import-linter>=2.13",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "ty>=0.0.51",
]

[tool.coverage.run]
source = ["trutina"]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.importlinter]
root_packages = ["trutina"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: apps -> infrastructure -> core -> shared/config"
type = "layers"
layers = [
    "trutina.cli | trutina.api",
    "trutina.storage_mongo",
    "trutina.core",
    "trutina.shared | trutina.config",
]

[[tool.importlinter.contracts]]
name = "Core must have zero Mongo/Beanie awareness"
type = "forbidden"
source_modules = ["trutina.core"]
forbidden_modules = ["beanie", "pymongo"]

[[tool.importlinter.contracts]]
name = "Core account -> journal -> posting layering"
type = "layers"
layers = [
    "trutina.core.posting",
    "trutina.core.journal",
    "trutina.core.account",
]
