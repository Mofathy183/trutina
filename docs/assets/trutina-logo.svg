<title id="title">Trutina</title>
<desc id="desc">A minimalist line-art balance scale with a triangular stand, symmetric beam, and two hanging pans, with the wordmark Trutina and the tagline "double-entry, in balance" below.</desc>

<g fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <line x1="190" y1="60" x2="190" y2="82" stroke-width="2"/>
  <line x1="110" y1="82" x2="270" y2="82" stroke-width="2"/>
  <line x1="110" y1="82" x2="110" y2="128" stroke-width="1.5"/>
  <line x1="270" y1="82" x2="270" y2="128" stroke-width="1.5"/>
  <circle cx="110" cy="142" r="15" stroke-width="2"/>
  <circle cx="270" cy="142" r="15" stroke-width="2"/>
  <path d="M 190 82 L 158 190 L 222 190 Z" stroke-width="2"/>
  <line x1="150" y1="190" x2="230" y2="190" stroke-width="2"/>
</g>
<circle cx="190" cy="82" r="5" fill="#111111"/>

<text x="190" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="3" fill="#111111">Trutina</text>
<text x="190" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#52514E">double-entry, in balance</text>
